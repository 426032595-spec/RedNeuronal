<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa mental neuronal</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; outline: none; }
  #menu {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 8px 12px; z-index: 10;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15);
    border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #menu button {
    background: rgba(255,255,255,.08); color: #e8f7ff; border: 1px solid rgba(255,255,255,.18);
    border-radius: 9px; padding: 7px 13px; font-size: 13px; cursor: pointer;
  }
  #menu button:hover { background: rgba(0,229,255,.25); }
  #menu button:focus-visible, #editor:focus-visible { outline: 2px solid #00e5ff; outline-offset: 2px; }
  #editor {
    position: fixed; display: none; z-index: 20; box-sizing: border-box; width: 150px; height: 30px;
    background: rgba(0,0,0,.85); color: #fff; border: 1px solid #00e5ff; border-radius: 8px;
    text-align: center; font: 600 14px system-ui, sans-serif; padding: 4px 6px;
  }
  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 94%;
    color: rgba(255,255,255,.5); font-size: 12px; text-align: center; pointer-events: none;
  }
</style>
</head>
<body>
<div id="menu">
  <button id="btnUndo" title="Ctrl + Z">Deshacer</button>
  <button id="btnStyle" title="Cambiar el diseño de los nodos">Estilo: Neurona</button>
  <button id="btnPng">Exportar PNG</button>
  <button id="btnPdf">Exportar PDF</button>
</div>
<canvas id="c" tabindex="0"></canvas>
<input id="editor" type="text" aria-label="Texto del nodo">
<div id="hint">Doble clic: crear o editar · Tab: nodo hijo · C: conectar · Supr: borrar · Ctrl+Z: deshacer</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const editor = document.getElementById('editor'), hint = document.getElementById('hint');
  const R = 34, TOL = 6, HINT = hint.textContent;
  const COLORS = ['#00e5ff', '#ff3df2', '#7cff4d', '#ffb300', '#8a6bff', '#ff5c7a'];

  let nodes = [], links = [], nextId = 1, colorIdx = 0;
  let selNode = null, selLink = null, drag = null, linking = null, mouse = { x: 0, y: 0 };
  let editing = null, editInfo = null, conn = null, history = [];

  /* ---------- Historial ---------- */
  const snapshot = () => JSON.stringify({ nodes, links, nextId, colorIdx });
  const pushHistory = s => { history.push(s || snapshot()); if (history.length > 200) history.shift(); };
  function undo() {
    if (editing || !history.length) return;
    const s = JSON.parse(history.pop());
    nodes = s.nodes; links = s.links; nextId = s.nextId; colorIdx = s.colorIdx;
    selNode = selLink = conn = null; draw();
  }

  /* ---------- Geometría ---------- */
  function distanceToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    let t = len2 === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }
  const byId = id => nodes.find(n => n.id === id);
  const STYLES = ['Neurona', 'Anillo', 'Píldora', 'Sólido'];
  let style = 0;
  const sizeOf = n => {
    if (style !== 2) return { w: 2 * R, h: 2 * R };
    ctx.font = '600 13px system-ui, sans-serif';
    return { w: Math.max(76, ctx.measureText(n.text || ' ').width + 32), h: 38 };
  };
  const hit = (n, x, y) => {
    if (style !== 2) return Math.hypot(x - n.x, y - n.y) <= R;
    const z = sizeOf(n); return Math.abs(x - n.x) <= z.w / 2 && Math.abs(y - n.y) <= z.h / 2;
  };
  const nodeAt = (x, y) => { for (let i = nodes.length - 1; i >= 0; i--) if (hit(nodes[i], x, y)) return nodes[i]; return null; };
  const linkAt = (x, y) => links.slice().reverse().find(l => { const a = byId(l.a), b = byId(l.b); return a && b && distanceToSegment(x, y, a.x, a.y, b.x, b.y) <= TOL; });
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const connected = (a, b) => links.some(l => (l.a === a.id && l.b === b.id) || (l.a === b.id && l.b === a.id));
  const newNode = (x, y) => { const n = { id: nextId++, x, y, text: 'Idea', color: COLORS[colorIdx++ % COLORS.length] }; nodes.push(n); return n; };

  /* ---------- Dibujo ---------- */
  function wrapText(text, maxW) {
    const lines = []; let cur = '';
    for (const w of (text || '').split(/\s+/).filter(Boolean)) {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function rr(g, x, y, w, h, r) {
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function render(g, w, h, preview) {
    g.fillStyle = '#05060a'; g.fillRect(0, 0, w, h);
    for (const l of links) {
      const a = byId(l.a), b = byId(l.b); if (!a || !b) continue;
      const sel = !preview && l === selLink;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y);
      g.strokeStyle = sel ? '#ff2a2a' : 'rgba(140,200,255,.55)'; g.lineWidth = sel ? 4 : 1.6;
      g.shadowColor = sel ? '#ff2a2a' : '#4aa8ff'; g.shadowBlur = sel ? 12 : 5; g.stroke(); g.shadowBlur = 0;
    }
    const guide = conn && conn.target !== conn.from ? [conn.from, conn.target] : linking ? [linking, mouse] : null;
    if (!preview && guide) {
      g.beginPath(); g.moveTo(guide[0].x, guide[0].y); g.lineTo(guide[1].x, guide[1].y);
      g.setLineDash([6, 6]); g.strokeStyle = conn ? '#fff' : 'rgba(255,255,255,.5)'; g.lineWidth = 2; g.stroke(); g.setLineDash([]);
    }
    g.font = '600 13px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const n of nodes) {
      const sel = !preview && n === selNode, tgt = !preview && conn && n === conn.target && n !== conn.from;
      const hi = sel || tgt, z = sizeOf(n);
      g.beginPath();
      if (style === 2) rr(g, n.x - z.w / 2, n.y - z.h / 2, z.w, z.h, z.h / 2); else g.arc(n.x, n.y, R, 0, Math.PI * 2);
      if (style === 0) {
        const grad = g.createRadialGradient(n.x, n.y, 4, n.x, n.y, R);
        grad.addColorStop(0, n.color + 'cc'); grad.addColorStop(1, n.color + '22'); g.fillStyle = grad;
      } else if (style === 3) g.fillStyle = n.color + 'dd';
      else g.fillStyle = '#0b0e18';
      g.shadowColor = hi ? '#fff' : n.color; g.shadowBlur = hi ? 28 : style === 3 ? 10 : 16; g.fill(); g.shadowBlur = 0;
      g.lineWidth = hi ? 3 : style === 1 ? 2.5 : 1.5; g.strokeStyle = hi ? '#fff' : n.color; g.stroke();
    }
    for (const n of nodes) { // texto al final, con contorno negro
      const lines = style === 2 ? [n.text || ''] : wrapText(n.text, R * 1.7).slice(0, 3), lh = 15, y0 = n.y - ((lines.length - 1) * lh) / 2;
      lines.forEach((ln, i) => {
        g.lineJoin = 'round'; g.lineWidth = 4; g.strokeStyle = '#000'; g.strokeText(ln, n.x, y0 + i * lh);
        g.fillStyle = '#fff'; g.fillText(ln, n.x, y0 + i * lh);
      });
    }
  }
  const draw = () => render(ctx, cv.clientWidth, cv.clientHeight, false);
  function resize() {
    const d = window.devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    ctx.setTransform(d, 0, 0, d, 0, 0); draw();
  }
  addEventListener('resize', resize);

  /* ---------- Edición de texto ---------- */
  function startEdit(n, initial, isNew) {
    editing = n; editInfo = { snap: snapshot(), orig: n.text, isNew };
    Object.assign(editor.style, { display: 'block', left: n.x - 75 + 'px', top: n.y - 15 + 'px' });
    editor.value = initial !== undefined ? initial : n.text;
    if (initial !== undefined) n.text = initial;
    draw(); editor.focus();
    if (initial === undefined) editor.select();
  }
  function endEdit(cancel) {
    if (!editing) return;
    const n = editing, info = editInfo; editing = editInfo = null; editor.style.display = 'none';
    if (cancel) n.text = info.orig;
    else if (!info.isNew && n.text !== info.orig) pushHistory(info.snap);
    draw(); cv.focus();
  }
  editor.addEventListener('input', () => { if (editing) { editing.text = editor.value; draw(); } });
  editor.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') endEdit(false);
    if (e.key === 'Escape') endEdit(true);
  });
  editor.addEventListener('blur', () => endEdit(false));

  /* ---------- Ratón ---------- */
  cv.addEventListener('contextmenu', e => {
    e.preventDefault();
    const p = pos(e), l = linkAt(p.x, p.y);
    if (l && !nodeAt(p.x, p.y)) { pushHistory(); links = links.filter(x => x !== l); if (selLink === l) selLink = null; draw(); }
  });
  cv.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    const p = pos(e); mouse = p; conn = null; hint.textContent = HINT; cv.focus();
    const n = nodeAt(p.x, p.y);
    if (n) {
      selNode = n; selLink = null;
      drag = { n, dx: p.x - n.x, dy: p.y - n.y, snap: snapshot(), moved: false, link: e.shiftKey };
      if (e.shiftKey) linking = n;
    } else { selNode = null; selLink = linkAt(p.x, p.y) || null; }
    draw();
  });
  addEventListener('mousemove', e => {
    mouse = pos(e);
    if (!drag) return;
    if (!drag.link) { drag.n.x = mouse.x - drag.dx; drag.n.y = mouse.y - drag.dy; drag.moved = true; }
    draw();
  });
  addEventListener('mouseup', e => {
    if (!drag) return;
    if (drag.link) {
      const t = nodeAt(mouse.x, mouse.y);
      if (t && t !== drag.n && !connected(drag.n, t)) { pushHistory(drag.snap); links.push({ a: drag.n.id, b: t.id }); }
    } else if (drag.moved) pushHistory(drag.snap);
    drag = linking = null; draw();
  });
  cv.addEventListener('dblclick', e => {
    const p = pos(e), n = nodeAt(p.x, p.y);
    if (n) { selNode = n; startEdit(n); return; }
    if (linkAt(p.x, p.y)) return;
    pushHistory(); selNode = newNode(p.x, p.y); selLink = null; startEdit(selNode, undefined, true);
  });

  /* ---------- Teclado ---------- */
  function nearestInDirection(from, cur, dx, dy) {
    let best = null, bestScore = Infinity;
    for (const n of nodes) {
      if (n === cur) continue;
      const vx = n.x - cur.x, vy = n.y - cur.y, along = vx * dx + vy * dy;
      if (along <= 0) continue;
      const score = Math.hypot(vx, vy) + Math.abs(vx * dy - vy * dx) * 1.5; // penaliza desviarse del eje
      if (score < bestScore) { bestScore = score; best = n; }
    }
    return best;
  }
  function endConnect() { conn = null; hint.textContent = HINT; draw(); }

  addEventListener('keydown', e => {
    if (editing) return;
    const k = e.key;
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }

    // Modo conectar: flechas eligen destino, Enter confirma, Esc cancela
    if (conn) {
      e.preventDefault();
      const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
      if (dir) { const n = nearestInDirection(conn.from, conn.target, dir[0], dir[1]); if (n) conn.target = n; draw(); }
      else if (k === 'Enter') {
        if (conn.target !== conn.from && !connected(conn.from, conn.target)) { pushHistory(); links.push({ a: conn.from.id, b: conn.target.id }); }
        endConnect();
      } else if (k === 'Escape' || k.toLowerCase() === 'c') endConnect();
      return;
    }

    if (k === 'Delete' || k === 'Backspace') {
      e.preventDefault();
      if (selNode) { pushHistory(); const id = selNode.id; nodes = nodes.filter(n => n !== selNode); links = links.filter(l => l.a !== id && l.b !== id); selNode = null; }
      else if (selLink) { pushHistory(); links = links.filter(l => l !== selLink); selLink = null; }
      draw(); return;
    }
    if (!selNode) return;
    if (k.toLowerCase() === 'c' && !e.ctrlKey && !e.metaKey && nodes.length > 1) {
      e.preventDefault(); conn = { from: selNode, target: selNode };
      hint.textContent = 'Conectar: flechas para elegir destino · Enter confirma · Esc cancela'; draw(); return;
    }
    if (k === 'Tab') { // nodo hijo ya conectado
      e.preventDefault(); pushHistory();
      const kids = links.filter(l => l.a === selNode.id || l.b === selNode.id).length;
      const ang = -Math.PI / 2 + kids * 0.9;
      const p = selNode;
      const child = newNode(Math.min(innerWidth - 50, Math.max(50, p.x + Math.cos(ang) * 130)), Math.min(innerHeight - 50, Math.max(80, p.y + Math.sin(ang) * 130)));
      links.push({ a: p.id, b: child.id }); selNode = child; startEdit(child, undefined, true); return;
    }
    if (k === 'Enter' || k === 'F2') { e.preventDefault(); startEdit(selNode); return; }
    if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); startEdit(selNode, k); }
  });

  /* ---------- Exportación ---------- */
  function exportCanvas() {
    const d = window.devicePixelRatio || 1, off = document.createElement('canvas');
    off.width = cv.clientWidth * d; off.height = cv.clientHeight * d;
    const g = off.getContext('2d'); g.scale(d, d); render(g, cv.clientWidth, cv.clientHeight, true);
    return off;
  }
  function download(url, name) { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  document.getElementById('btnPng').onclick = () => download(exportCanvas().toDataURL('image/png'), 'mapa-mental.png');
  document.getElementById('btnPdf').onclick = () => {
    if (!window.jspdf) { alert('No se pudo cargar jsPDF. Revisa tu conexión a internet.'); return; }
    const off = exportCanvas(), w = off.width, h = off.height;
    const pdf = new window.jspdf.jsPDF({ orientation: w >= h ? 'landscape' : 'portrait', unit: 'px', format: [w, h], hotfixes: ['px_scaling'] });
    pdf.addImage(off.toDataURL('image/png'), 'PNG', 0, 0, w, h);
    pdf.save('mapa-mental.pdf');
  };
  document.getElementById('btnUndo').onclick = undo;
  const btnStyle = document.getElementById('btnStyle');
  btnStyle.onclick = () => { style = (style + 1) % STYLES.length; btnStyle.textContent = 'Estilo: ' + STYLES[style]; draw(); cv.focus(); };

  resize(); cv.focus();
})();
</script>
</body>
</html>
